<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Mock Tests | MMH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/live-mock-style.css">
</head>
<body>

<div class="exam-page-container">
    <div class="sticky-header-section">

        <div class="header-top-row">
            <a href="/" class="back-circle-btn"><i class="fas fa-arrow-left"></i></a>
            <h5 class="header-title">Live Mock Tests</h5>
        </div>

        <div class="live-status-tabs" id="status-tabs-wrap"></div>

        <div class="filter-scroll-wrapper" id="category-wrap"></div>
        <div id="deep-filter-wrap"></div>
    </div>

    <div class="scrollable-grid-area">
        <div id="grid-sync" class="text-center small text-primary mb-3"></div>
        <div id="quizGrid" class="live-mock-grid"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<script src="/js/live-mock-engine.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('mmh_theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        initLiveMockEngine();
    });
</script>

</body>
</html>
