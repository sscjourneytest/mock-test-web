<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saved Questions - Mock Matrix Hub</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script src="/firebase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js"></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    chtml: {
      mtextInheritFont: true,
      displayAlign: 'left',
      linebreaks: {
        allow: true,
        width: 'container',
        overflow: 'linebreak'
      }
    },
    options: {
      skipHtmlTags: ['script', 'style', 'textarea', 'pre']
    }
  };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

  <link rel="stylesheet" href="/css/saved.css">
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="header-title">SAVED QUESTIONS</div>
      <select id="globalLangSelect" class="mode-btn" style="flex: 0 0 90px; border: 1px solid #cbd5e1;" onchange="changeGlobalLang(this.value)">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="bilingual">Bilingual</option>
      </select>
    </div>

    <input type="text" id="searchBar" class="search-box" placeholder="Search Quiz ID or question text..." oninput="applyFilters()">

    <div class="mode-switch">
      <button id="listModeBtn" class="mode-btn active" onclick="switchMode('list')">LIST VIEW</button>
      <button id="focusModeBtn" class="mode-btn" onclick="switchMode('focus')">FOCUS MODE</button>
    </div>

    <div class="toggles-bar">
      <div class="toggle-row">
        <span class="toggle-label">Reattempt Mode</span>
        <label class="toggle-switch">
          <input type="checkbox" id="reattemptToggle" onchange="onReattemptToggle(this.checked)">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Palette Navigate</span>
        <label class="toggle-switch">
          <input type="checkbox" id="paletteToggle" onchange="onPaletteToggle(this.checked)">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="subject-filter-row" id="subjectFilterRow"></div>
  </div>

  <div class="container">
    <div id="loader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px 0;">
      <div class="spinner"></div>
      <p style="margin-top: 15px; color: #666; font-weight: 600;">Loading your library...</p>
    </div>

    <div id="listView"></div>

    <div id="focusView" style="display:none;">
      <div id="focusContent"></div>
    </div>

    <div id="emptyState" style="display:none; text-align:center; padding:80px 20px;">
      <i class="fas fa-bookmark mb-3" style="font-size:48px; opacity:0.2;"></i>
      <h3>Your library is empty</h3>
    </div>
  </div>

  <div class="palette-wrap" id="paletteWrap">
    <div class="palette-grid" id="paletteGrid"></div>
  </div>
  <button class="palette-fab" id="paletteFab" onclick="togglePaletteSheet()" aria-label="Question palette">
    <i class="fas fa-th"></i>
  </button>

  <div class="focus-nav" id="focusNav" style="display:none;">
    <button class="btn" style="background:var(--primary); color:white; height:42px;" onclick="navFocus(-1)">PREVIOUS</button>
    <button class="btn" style="background:var(--primary); color:white; height:42px;" onclick="navFocus(1)">NEXT</button>
  </div>

  <div class="bottom-nav">
    <a href="/index.html" class="nav-item"><i class="fas fa-home"></i>HOME</a>
    <a href="/exams" class="nav-item"><i class="fas fa-file-alt"></i>EXAMS</a>
    <a href="/live-test" class="nav-item"><i class="fas fa-bolt"></i>LIVE</a>
    <a href="/saved.html" class="nav-item active"><i class="fas fa-star"></i>SAVED</a>
    <a href="/profile.html" class="nav-item"><i class="fas fa-user-circle"></i>PROFILE</a>
  </div>

  <!-- Move to Section modal -->
  <div class="mmh-modal-overlay" id="moveModalOverlay">
    <div class="mmh-modal-box">
      <h4>Move to Section</h4>
      <div id="moveSubjectOptions"></div>
      <button class="mmh-modal-cancel" onclick="closeMoveModal()">Cancel</button>
    </div>
  </div>

  <script src="/js/saved.js"></script>
</body>
</html>
