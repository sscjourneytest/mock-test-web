<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Series Hub | Mock Matrix Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Same shared stylesheet as home/exams page — grid, skeleton all live here -->
    <link rel="stylesheet" href="/css/exams.css">

    <style>
        /* Badge styles kept local to this page — not touching shared exam-style.css */
        .new-badge-blink {
            background: #ef4444; color: white; font-size: 8px;
            padding: 1px 5px; border-radius: 4px; font-weight: 900;
            margin-left: 8px; vertical-align: middle;
            animation: blink-animation 1s steps(5, start) infinite;
        }
        @keyframes blink-animation { to { visibility: hidden; } }

        .free-badge-green {
            background: #22c55e; color: white; font-size: 9px;
            padding: 2px 6px; border-radius: 4px; margin-left: 5px;
            font-weight: 800; vertical-align: middle;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <button class="back-btn" onclick="handleBack()"><i class="fas fa-arrow-left"></i></button>
        <h1 class="header-title" id="pageTitle">Preparation Series</h1>
    </header>

    <div id="view-categories" class="view-screen active">
        <div class="category-grid" id="seriesGrid"></div>
    </div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="/exams/" class="nav-item"><i class="fas fa-book-open"></i><span>Exams</span></a>
        <a href="/live-test" class="nav-item"><i class="fas fa-bolt"></i><span>Live</span></a>
        <a href="/profile" class="nav-item"><i class="fas fa-user-circle"></i><span>Profile</span></a>
    </nav>

    <script>
        function handleBack() {
            window.location.href = '/';
        }

        // Theme Sync
        if (localStorage.getItem('theme') === 'dark' || localStorage.getItem('mmh_theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        const SERIES_CONFIG_URL = '/data/series-categories.json';
        const SKELETON_COUNT = 3;

        function renderSkeletons(count) {
            const grid = document.getElementById('seriesGrid');
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="skeleton-exam-box">
                        <div class="skeleton-line skeleton-logo"></div>
                        <div style="flex:1;">
                            <div class="skeleton-line skeleton-title"></div>
                            <div class="skeleton-line skeleton-sub"></div>
                        </div>
                    </div>`;
            }
            grid.innerHTML = html;
        }

        function badgeHtml(badges) {
            if (!badges || !badges.length) return '';
            return badges.map(b => {
                if (b.toUpperCase() === 'FREE') return `<span class="free-badge-green">FREE</span>`;
                if (b.toUpperCase() === 'NEW') return `<span class="new-badge-blink">NEW</span>`;
                return `<span class="free-badge-green">${b}</span>`;
            }).join('');
        }

        function iconOrLogoHtml(item) {
            if (item.logo) {
                return `<img src="${item.logo}" class="exam-logo-img" alt="${item.title}">`;
            }
            return `<div class="exam-logo-img d-flex align-items-center justify-content-center bg-light">
                        <i class="${item.icon || 'fas fa-layer-group'} fs-3 ${item.iconColor || 'text-secondary'}"></i>
                    </div>`;
        }

        function renderSeries(items) {
            const grid = document.getElementById('seriesGrid');

            if (!items || !items.length) {
                grid.innerHTML = `<p class="text-center text-grey">No series available right now.</p>`;
                return;
            }

            grid.innerHTML = items.map(item => {
                const badges = badgeHtml(item.badges);
                const titleBlock = `<h3>${item.title} ${badges}${item.comingSoon ? '<span class="badge-soon">COMING SOON</span>' : ''}</h3>
                                     <p>${item.subtitle || ''}</p>`;

                if (item.comingSoon) {
                    return `
                        <div class="exam-box" style="cursor:not-allowed; opacity:0.85;" onclick="showComingSoon()">
                            ${iconOrLogoHtml(item)}
                            <div class="exam-info">${titleBlock}</div>
                            <i class="fas fa-chevron-right chevron"></i>
                        </div>`;
                }

                return `
                    <a href="${item.url}" class="exam-box">
                        ${iconOrLogoHtml(item)}
                        <div class="exam-info">${titleBlock}</div>
                        <i class="fas fa-chevron-right chevron"></i>
                    </a>`;
            }).join('');
        }

        function showComingSoon() {
            alert('Coming soon! This series is not live yet.');
        }

        async function loadSeries() {
            renderSkeletons(SKELETON_COUNT);
            try {
                const res = await fetch(SERIES_CONFIG_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error('Failed to load series config: ' + res.status);
                const data = await res.json();
                renderSeries(data.series);
            } catch (err) {
                console.error(err);
                document.getElementById('seriesGrid').innerHTML =
                    `<p class="text-center text-danger">Could not load series. Please try again.</p>`;
            }
        }

        loadSeries();
    </script>
</body>
</html>
