<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notifications — Mock Matrix Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #2563eb;
        --primary-light: #eff6ff;
        --secondary: #1e40af;
        --accent: #f59e0b;
        --text-dark: #0f172a;
        --text-grey: #64748b;
        --bg-light: #f8fafc;
        --white: #ffffff;
        --border: #e2e8f0;
        --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
        --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
    }
    body.dark-mode {
        --text-dark: #f1f5f9;
        --text-grey: #94a3b8;
        --bg-light: #0f172a;
        --white: #1e293b;
        --border: #334155;
        background-color: #020617 !important;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg-light);
        color: var(--text-dark);
        font-family: 'Inter', sans-serif;
        padding-bottom: 40px;
        transition: background 0.3s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .page-header {
        background: var(--white);
        border-bottom: 1px solid var(--border);
        padding: 14px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: var(--shadow-sm);
    }
    .back-btn {
        width: 36px; height: 36px; border-radius: 12px;
        background: var(--primary-light); color: var(--primary);
        display: flex; align-items: center; justify-content: center;
        text-decoration: none; flex-shrink: 0; font-size: 0.95rem;
    }
    .page-header h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 1.05rem; font-weight: 800; margin: 0; color: var(--text-dark);
    }
    .mark-all-btn {
        margin-left: auto;
        font-size: 0.75rem; font-weight: 700; color: var(--primary);
        background: none; border: none; cursor: pointer; white-space: nowrap;
    }

    .notif-list { padding: 14px; max-width: 640px; margin: 0 auto; }

    .date-group-label {
        font-size: 0.72rem; font-weight: 800; color: var(--text-grey);
        text-transform: uppercase; letter-spacing: 0.06em;
        margin: 20px 4px 10px;
    }
    .date-group-label:first-child { margin-top: 4px; }

    .notif-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 10px;
        display: flex;
        gap: 12px;
        text-decoration: none;
        color: var(--text-dark);
        box-shadow: var(--shadow-sm);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
        position: relative;
        overflow: hidden;
    }
    .notif-card:active { transform: scale(0.98); }

    .notif-card.unread {
        border-color: rgba(37, 99, 235, 0.35);
        background: linear-gradient(135deg, var(--primary-light) 0%, var(--white) 70%);
    }
    body.dark-mode .notif-card.unread {
        background: linear-gradient(135deg, rgba(37,99,235,0.14) 0%, var(--white) 75%);
    }
    .notif-card.unread::before {
        content: "";
        position: absolute; left: 0; top: 0; bottom: 0;
        width: 3px; background: var(--primary);
    }

    .notif-icon {
        width: 42px; height: 42px; border-radius: 12px;
        background: var(--primary-light); color: var(--primary);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; font-size: 1.05rem;
    }
    .notif-card.unread .notif-icon {
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        color: white;
        box-shadow: 0 4px 10px rgba(37,99,235,0.35);
    }

    .notif-body { flex: 1; min-width: 0; }
    .notif-title {
        font-weight: 700; font-size: 0.93rem; margin-bottom: 3px;
        display: flex; align-items: center; gap: 6px;
        color: var(--text-dark);
    }
    .unread-dot {
        width: 7px; height: 7px; background: #ef4444; border-radius: 50%; flex-shrink: 0;
    }
    .notif-text {
        font-size: 0.85rem; color: var(--text-grey); line-height: 1.45;
    }
    .notif-time {
        font-size: 0.72rem; color: var(--text-grey); opacity: 0.75; margin-top: 6px;
        display: flex; align-items: center; gap: 5px;
    }

    .load-more-btn {
        display: block; width: 100%;
        background: var(--white); border: 1.5px solid var(--border);
        color: var(--primary); font-weight: 700; font-size: 0.85rem;
        padding: 13px; border-radius: 14px; margin-top: 8px; cursor: pointer;
    }
    .load-more-btn:disabled { opacity: 0.5; }

    .empty-state { text-align: center; padding: 70px 20px; color: var(--text-grey); }
    .empty-state .empty-icon {
        width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px;
        background: var(--primary-light); color: var(--primary);
        display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
    }
    .empty-state h3 { font-family: 'Poppins', sans-serif; font-size: 1rem; color: var(--text-dark); margin-bottom: 4px; }
    .empty-state p { font-size: 0.85rem; margin: 0; }

    .skeleton {
        background: var(--white); border: 1px solid var(--border);
        border-radius: 16px; height: 76px; margin-bottom: 10px;
        position: relative; overflow: hidden;
    }
    .skeleton::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, rgba(148,163,184,0.15), transparent);
        animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
</style>
</head>
<body>

<header class="page-header">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <h1>Notifications</h1>
    <button class="mark-all-btn" id="markAllBtn">Mark all read</button>
</header>

<div class="notif-list" id="notifList">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
</div>

<div class="notif-list" style="padding-top:0;">
    <button class="load-more-btn" id="loadMoreBtn" style="display:none;" onclick="loadNotifications(false)">
        Load More
    </button>
</div>

<script>
const NOTIFY_API_BASE = 'https://mmh-notify-worker.mockmatrixsupport.workers.dev';
const PAGE_SIZE = 10;

let oldestLoadedId = null;
let lastSeenIdAtPageLoad = parseInt(localStorage.getItem('mmh_last_seen_notif_id') || '0', 10);
let newestIdSeenThisSession = lastSeenIdAtPageLoad;

function timeAgo(unixSeconds) {
    const diffMs = Date.now() - (unixSeconds * 1000);
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ago';
    const days = Math.floor(hours / 24);
    if (days < 7) return days + 'd ago';
    return new Date(unixSeconds * 1000).toLocaleDateString();
}

function dateGroupLabel(unixSeconds) {
    const d = new Date(unixSeconds * 1000);
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);

    const sameDay = (a, b) => a.toDateString() === b.toDateString();
    if (sameDay(d, today)) return 'Today';
    if (sameDay(d, yesterday)) return 'Yesterday';
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}

function renderNotification(n) {
    const isUnread = n.id > lastSeenIdAtPageLoad;
    if (n.id > newestIdSeenThisSession) newestIdSeenThisSession = n.id;

    const card = document.createElement('a');
    card.href = n.url || '#';
    card.className = 'notif-card' + (isUnread ? ' unread' : '');
    card.innerHTML = `
        <div class="notif-icon"><i class="fas fa-bell"></i></div>
        <div class="notif-body">
            <div class="notif-title">${isUnread ? '<span class="unread-dot"></span>' : ''}${escapeHtml(n.title)}</div>
            <div class="notif-text">${escapeHtml(n.body)}</div>
            <div class="notif-time"><i class="fas fa-clock" style="font-size:0.65rem;"></i> ${timeAgo(n.created_at)}</div>
        </div>
    `;
    return card;
}

async function loadNotifications(isFirstLoad) {
    const listEl = document.getElementById('notifList');
    const btn = document.getElementById('loadMoreBtn');

    if (isFirstLoad) {
        listEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    } else {
        btn.disabled = true;
        btn.textContent = 'Loading...';
    }

    try {
        let url = `${NOTIFY_API_BASE}/api/notify/list?limit=${PAGE_SIZE}`;
        if (!isFirstLoad && oldestLoadedId) {
            url += `&before_id=${oldestLoadedId}`;
        }

        const res = await fetch(url);
        const data = await res.json();
        const list = data.notifications || [];

        if (isFirstLoad) listEl.innerHTML = '';

        if (list.length === 0 && isFirstLoad) {
            listEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-bell-slash"></i></div>
                    <h3>No notifications yet</h3>
                    <p>We'll let you know when something important comes up.</p>
                </div>`;
            btn.style.display = 'none';
            return;
        }

        let lastGroupLabel = null;
        // If this is a "Load More" page, figure out what group label the
        // last rendered card belonged to, so we don't repeat a date header
        // that's already showing at the bottom of the current list.
        if (!isFirstLoad) {
            const existingLabels = listEl.querySelectorAll('.date-group-label');
            if (existingLabels.length > 0) {
                lastGroupLabel = existingLabels[existingLabels.length - 1].textContent;
            }
        }

        list.forEach(n => {
            const label = dateGroupLabel(n.created_at);
            if (label !== lastGroupLabel) {
                const groupEl = document.createElement('div');
                groupEl.className = 'date-group-label';
                groupEl.textContent = label;
                listEl.appendChild(groupEl);
                lastGroupLabel = label;
            }
            listEl.appendChild(renderNotification(n));
            oldestLoadedId = n.id;
        });

        btn.style.display = data.hasMore ? 'block' : 'none';
        btn.disabled = false;
        btn.textContent = 'Load More';

        if (newestIdSeenThisSession > 0) {
            localStorage.setItem('mmh_last_seen_notif_id', String(newestIdSeenThisSession));
        }
    } catch (err) {
        console.error('Failed to load notifications:', err);
        if (isFirstLoad) {
            listEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-triangle-exclamation"></i></div>
                    <h3>Couldn't load notifications</h3>
                    <p>Pull to refresh or check your connection.</p>
                </div>`;
        } else {
            btn.disabled = false;
            btn.textContent = 'Load More';
        }
    }
}

document.getElementById('markAllBtn').addEventListener('click', () => {
    if (newestIdSeenThisSession > 0) {
        localStorage.setItem('mmh_last_seen_notif_id', String(newestIdSeenThisSession));
    }
    document.querySelectorAll('.notif-card.unread').forEach(card => {
        card.classList.remove('unread');
        const dot = card.querySelector('.unread-dot');
        if (dot) dot.remove();
    });
});

// Matches the rest of the site's dark mode toggle (same localStorage key)
if (localStorage.getItem('mmh_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.body.classList.add('dark-mode');
}

loadNotifications(true);
</script>

</body>
</html>
